<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EFED; --ink:#15302C; --muted:#56706B; --line:#D3DDDA;
  --primary:#0D6A62; --primary-ink:#FFFFFF; --primary-soft:#DDEEEB;
  --due:#9A6213; --due-bg:#FBEFD9; --pos:#2A7448; --pos-bg:#E0F1E6; --note:#2F628F; --note-bg:#E2ECF7;
  --bad:#A8372E; --bad-bg:#F8E1DE; --demo:#7A4B00; --demo-bg:#FFE7B3;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C1A; --surface:#172725; --surface-2:#1F3330; --ink:#E4EEEC; --muted:#9DB3AE; --line:#2C4440;
    --primary:#4CC2B4; --primary-ink:#06221F; --primary-soft:#1B3D39;
    --due:#F0BE67; --due-bg:#3A2D14; --pos:#7FD3A0; --pos-bg:#173426; --note:#8EBDE8; --note-bg:#172B3F;
    --bad:#F29A90; --bad-bg:#3D1C19; --demo:#FFD27A; --demo-bg:#3B2C0B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C1A; --surface:#172725; --surface-2:#1F3330; --ink:#E4EEEC; --muted:#9DB3AE; --line:#2C4440;
  --primary:#4CC2B4; --primary-ink:#06221F; --primary-soft:#1B3D39;
  --due:#F0BE67; --due-bg:#3A2D14; --pos:#7FD3A0; --pos-bg:#173426; --note:#8EBDE8; --note-bg:#172B3F;
  --bad:#F29A90; --bad-bg:#3D1C19; --demo:#FFD27A; --demo-bg:#3B2C0B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px}
a{color:var(--primary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px}
.tbl-wrap,main{position:relative}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.demo{background:var(--demo-bg);color:var(--demo);font-weight:700;text-align:center;font-size:14px;padding:5px 12px;
  background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(0,0,0,.04) 14px 28px)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand > span{min-width:0;overflow:hidden}
.mark{width:38px;height:38px;flex:none}
.brand b{font-size:22px;letter-spacing:0;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small.by{color:var(--primary);font-weight:600;font-size:12px;margin-top:2px}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.store{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:none;cursor:pointer}
.store i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.store[data-mode="account"] i{background:var(--pos)}
.store[data-mode="browser"] i{background:var(--due)}
.store[data-mode="memory"] i{background:var(--bad)}

main{max-width:1120px;margin:0 auto;padding:20px 16px 110px;overflow-x:clip}
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .bar{gap:10px}
  .store{margin-inline-start:auto}
  .brand small{white-space:normal}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav a{flex:1;text-align:center;padding:9px 4px 8px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:600}
  .bnav a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--primary)}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* Type */
h1{font-size:26px;line-height:1.3;margin:0 0 4px;font-weight:700}
h2{font-size:19px;line-height:1.35;margin:0 0 12px;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.lede{color:var(--muted);margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 16px;border-radius:var(--r-md);font-weight:600;cursor:pointer;text-decoration:none;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.big{font-size:17px;padding:14px 22px;min-height:54px;border-radius:var(--r-lg)}
.btn.sm{padding:5px 11px;min-height:34px;font-size:13.5px}
.btn.wa{background:#1F8A4C;color:#fff;border-color:#1F8A4C;text-decoration:none}
.btn.wa:hover{filter:brightness(1.08)}
[hidden]{display:none!important}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn svg{width:18px;height:18px;flex:none}

/* Layout pieces */
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;color:var(--muted);font-size:14px}
.summary b{color:var(--ink);font-size:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;margin-bottom:8px;flex-wrap:wrap}
.panel-h h2{margin:0}
.count{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list > li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .who{font-weight:700}
.list .what{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}

.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.due{background:var(--due-bg);color:var(--due)}
.tag.late{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--pos-bg);color:var(--pos)}
.tag.pos{background:var(--pos-bg);color:var(--pos)}
.tag.note{background:var(--note-bg);color:var(--note)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}

/* Filters */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:14px 0 16px}
@media (max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13.5px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:600}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;min-height:42px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.invalid{border-color:var(--bad)!important}

/* Student rows */
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;text-decoration:none;color:inherit}
.srow:hover{border-color:var(--primary)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.srow .meta{color:var(--muted);font-size:13.5px}
.srow .flags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.srow{grid-template-columns:auto 1fr}.srow .flags{grid-column:1/-1;justify-content:flex-start}}

/* Student file */
.crumbs{font-size:13.5px;margin-bottom:8px}
.crumbs a{text-decoration:none}
.shead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.shead .avatar{width:56px;height:56px;font-size:21px}
.shead .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12.5px;color:var(--muted)}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.section-h:first-child{margin-top:0}
.section-h h2{margin:0}

/* Goals */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.goal.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--primary)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.goal.flash{animation:none;outline:3px solid var(--primary)}}
.goal-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.goal-area{font-size:13px;color:var(--primary);font-weight:700}
.goal-text{font-weight:600;margin:2px 0 10px;max-width:70ch}
.goal-stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;color:var(--muted);align-items:center}
.goal-stats b{color:var(--ink)}
.trail{display:block;width:100%;max-width:340px;height:auto}
.gl{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.tbl-wrap{overflow-x:auto}
.gl th,.gl td{text-align:start;padding:8px 8px;border-top:1px solid var(--line);vertical-align:top}
.gl th{font-size:12.5px;color:var(--muted);font-weight:600;border-top:0}
.gl tr.new td{background:var(--primary-soft)}
.res{font-weight:700;white-space:nowrap}
.cmp{font-size:13px;white-space:nowrap}
.cmp.up{color:var(--pos)}.cmp.down{color:var(--bad)}.cmp.na{color:var(--muted);white-space:normal}

/* Records */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;border-inline-start:5px solid var(--line)}
.rec.positive{border-inline-start-color:var(--pos)}
.rec.note{border-inline-start-color:var(--note)}
.rec.violation{border-inline-start-color:var(--bad)}
.rec-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rec-h .sp{flex:1}
.rec p{margin:4px 0}
.rec .lbl{color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.work{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.thumb{width:64px;height:80px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:28px;height:28px}
@media (max-width:520px){.work{grid-template-columns:52px 1fr}.work .btn{grid-column:1/-1;justify-self:start}.thumb{width:52px;height:64px}}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,25,23,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(680px,100%);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0}
.modal-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal-b .full{grid-column:1/-1}
@media (max-width:560px){.modal-b{grid-template-columns:1fr}}
.modal-f{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .sp{flex:1}
.x{background:none;border:0;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px}
.score input{text-align:center}
.preview{grid-column:1/-1;background:var(--surface-2);border-radius:var(--r-md);padding:10px 14px;font-size:14px}
.preview b{font-size:16px}

.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 24px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer}
@media (min-width:761px){.toast{bottom:24px}}

/* Report */
.rep-controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:12px 0}
@media (max-width:620px){.rep-controls{grid-template-columns:1fr 1fr}.rep-controls .s{grid-column:1/-1}}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.paper{background:#fff;color:#14231F;border:1px solid var(--line);border-radius:var(--r-md);padding:28px;max-width:900px;margin:0 auto}
.paper h1{font-size:22px}
.paper .r-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #0D6A62;padding-bottom:12px;margin-bottom:14px}
.paper .r-demo{border:2px dashed #9A6213;color:#7A4B00;background:#FFF5DC;font-weight:700;text-align:center;padding:6px;border-radius:6px;margin-bottom:14px}
.paper h2{font-size:16px;margin:20px 0 8px;color:#0D6A62}
.paper table{width:100%;border-collapse:collapse;font-size:13px}
.paper th,.paper td{border:1px solid #CBD6D3;padding:6px 8px;text-align:start;vertical-align:top}
.paper th{background:#EEF4F2;font-weight:600}
.paper .muted{color:#5A6D69}
.paper .dl dt{color:#5A6D69}
.paper .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;font-size:13px}
.paper .sig div{border-top:1px solid #7A8C88;padding-top:6px}
.paper .tag{background:#EEF4F2;color:#304B46}
.paper .tag.late{background:#F8E1DE;color:#A8372E}
.paper .tag.due{background:#FBEFD9;color:#9A6213}
.paper .tag.ok{background:#E0F1E6;color:#2A7448}
.paper .cmp.up{color:#2A7448}.paper .cmp.down{color:#A8372E}.paper .cmp.na{color:#5A6D69}
@media (max-width:620px){.paper{padding:16px}.paper .sig{grid-template-columns:1fr}}

.storage-note{font-size:13.5px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--surface);margin-top:22px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.storage-note .grow{flex:1;min-width:220px}

/* Worksheets */
.wsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wscard{display:flex;flex-direction:column;gap:10px}
.wscard-top{display:flex;gap:12px;align-items:flex-start}
.wscard h3{margin:2px 0}
.wsthumb{width:60px;height:76px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);overflow:hidden;flex:none}
.wsthumb img{width:100%;height:100%;object-fit:cover}
.wsthumb svg{width:26px;height:26px}
.wsact{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.wsres{list-style:none;margin:0;padding:0;font-size:13.5px}
.wsres li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.qed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}
.qed.has-err{border-color:var(--bad)}
.qed-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qed-h .sp{flex:1}
.qed .err{font-size:13px;color:var(--bad);font-weight:600}
.optrow{display:flex;gap:8px;align-items:center;margin-top:6px}
.optrow .ltr{width:24px;text-align:center;font-weight:700;color:var(--muted);flex:none}
.optrow > input[type=text]{flex:1;min-width:0}
.okl{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;white-space:nowrap;font-weight:600;cursor:pointer}
.okl input{width:18px;height:18px;accent-color:var(--pos)}
.tfrow{display:flex;gap:18px;margin-top:8px}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgs figure{margin:0;position:relative}
.imgs img{display:block;width:110px;height:140px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2)}
.imgs figure .btn{position:absolute;top:4px;inset-inline-end:4px;min-height:30px;padding:2px 8px}
.edit-bar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
@media (min-width:761px){.edit-bar{bottom:12px}}
.errbox{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px;font-weight:600}
.errbox ul{margin:4px 0 0;padding-inline-start:20px;font-weight:500}
.steps{margin:10px 0;padding-inline-start:22px}
.steps li{margin-bottom:4px}
.solve-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--due-bg);color:var(--ink);border-radius:var(--r-md);padding:8px 12px;margin-bottom:14px}
.solve-bar .sp{flex:1}
.wsr{max-width:820px;margin:0 auto}
.wsr h1{overflow-wrap:anywhere}
.wsr-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.wsr-sub{color:var(--primary);font-weight:700;font-size:13.5px}
.wsr-meta{color:var(--muted);font-size:14px}
.wsr-prog{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 10px}
.wsr-prog i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.wsr-ins{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px;line-height:1.95;display:flex;gap:10px;align-items:flex-start}
.wsr-img{margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px}
.wsr-img img{display:block;width:100%;height:auto;border-radius:var(--r-sm)}
.wsr-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;border-inline-start:6px solid var(--line)}
.wsr-q.is-ok{border-inline-start-color:var(--pos)}
.wsr-q.is-bad{border-inline-start-color:var(--bad)}
.wsr-qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.wsr-qh p{margin:3px 0 0;font-weight:600;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.wsr-n{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none}
.wsr-say{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;cursor:pointer;flex:none;font-size:17px;line-height:1}
.wsr-opts{display:grid;gap:8px}
.wsr-opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-md);cursor:pointer;background:var(--surface);min-height:52px;font-size:16px}
.wsr-opt input{width:20px;height:20px;accent-color:var(--primary);flex:none;margin:0}
.wsr-opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.wsr-opt:has(input:disabled){cursor:default}
input.wsr-in{font-size:17px;min-height:52px}
.wsr-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.wsr-msg{color:var(--due);font-weight:600;font-size:14px}
.wsr-fb{margin-top:10px;padding:10px 14px;border-radius:var(--r-md);font-weight:600;font-size:16px;outline:none}
.wsr-fb.ok{background:var(--pos-bg);color:var(--pos)}
.wsr-fb.try{background:var(--due-bg);color:var(--due)}
.wsr-fb.bad{background:var(--bad-bg);color:var(--bad)}
.wsr-end{display:flex;flex-direction:column;align-items:center;gap:8px;margin:20px 0}
.wsr.big{font-size:19px}
.wsr.big .wsr-qh p{font-size:22px}
.wsr.big .wsr-opt{font-size:20px;min-height:62px}
.wsr.big input.wsr-in{font-size:21px}
.wsr.big .wsr-ins{font-size:20px}
.wsr-result{text-align:center;padding:10px 0 16px}
.wsr-ring{--p:0;width:150px;height:150px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-2) 0)}
.wsr-ring b{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-content:center;font-size:40px;line-height:1}
.wsr-ring small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:6px}
.wsr-sum{list-style:none;margin:0 0 14px;padding:0}
.wsr-sum li{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:6px;background:var(--surface)}
.wsr-sum li > span{font-weight:700;width:22px;flex:none;text-align:center}
.wsr-sum li.ok > span{color:var(--pos)}
.wsr-sum li.mid > span{color:var(--due)}
.wsr-sum li.bad > span{color:var(--bad)}
.wsr-after{display:flex;flex-direction:column;gap:10px;align-items:center}
.pf{max-width:860px}
.pf-hello{background:var(--primary-soft);border-radius:var(--r-lg);padding:14px 16px;margin:12px 0 18px}
.pf .goal{break-inside:avoid}

/* Auth, portal, exams */
.userbox{display:flex;align-items:center;gap:6px;font-size:13.5px}
.userbox .who-name{font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body[data-mode="auth"] .nav,body[data-mode="auth"] .bnav,body[data-mode="auth"] #storeChip,
body[data-mode="portal"] .nav,body[data-mode="portal"] .bnav,body[data-mode="portal"] #storeChip{display:none!important}
body[data-mode="auth"] main,body[data-mode="portal"] main{padding-bottom:40px}
.auth{max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
.auth-card h1{font-size:23px;margin-bottom:12px}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-switch{align-self:center;font-weight:600;text-decoration:none;padding:8px}
.portal-box{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.portal-box .grow{flex:1;min-width:240px}
.pin{font-size:44px;font-weight:700;letter-spacing:10px;text-align:center;background:var(--primary-soft);color:var(--primary);border-radius:var(--r-lg);padding:14px;margin:8px 0;font-variant-numeric:tabular-nums}
.asg-g{border-top:1px solid var(--line);padding:8px 0}
.asg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.asg-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 0}
.asg-row select{min-height:36px;padding:4px 8px}
.bar-q{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px;max-width:420px}
.bar-q i{display:block;height:100%}
.pexam{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.pexam .grow{flex:1;min-width:220px}
.pbar{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:6;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px;margin-bottom:8px}
.pbar.warn,.pbar:has(.warn){border-color:var(--bad)}
.ptime{font-weight:600}
.ptime b{font-size:20px;margin-inline-start:6px}
.ptime.warn{color:var(--bad)}
body[data-mode="portal"] .top,body[data-mode="auth"] .top{position:static}

@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body::before,.top,.bnav,.no-print,.toast,.scrim{display:none!important}
  main{padding:0;max-width:none}
  .paper{border:0;padding:0;max-width:none}
  .paper table{page-break-inside:auto}
  .paper tr{page-break-inside:avoid}
}

function rowsOf(st){
  const out = new Map();
  st.students.forEach(s => {
    out.set("students:" + s.id, {t:"students", row:studentRow(s)});
    KIDS.forEach(k => MAP[k].list(s).forEach((r, i) => out.set(MAP[k].t + ":" + r.id, {t:MAP[k].t, row:MAP[k].to(r, s, i)})));
  });
  return out;
}

async function fetchAll(table, cols, order){
  const out = []; let from = 0;
  for(;;){
    let q = sb.from(table).select(cols).range(from, from + 999);
    if(order) q = q.order(order);
    const {data, error} = await q;
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function fetchState(){
  const [st, go, ac, fu, wo, be, co] = await Promise.all([
    fetchAll("students", STU_COLS, "name"), fetchAll("goals", "*", "sort"), fetchAll("accommodations", "*", "sort"),
    fetchAll("followups", "*", "date"), fetchAll("works", "*", "date"), fetchAll("behavior", "*", "date"), fetchAll("comms", "*", "date")]);
  const byId = {}; const students = st.map(r => (byId[r.id] = studentFrom(r)));
  go.forEach(r => { const s = byId[r.student_id]; if(s) s.iep.goals.push(MAP.goals.from(r)); });
  ac.forEach(r => { const s = byId[r.student_id]; if(s) s.accommodations.push(MAP.accommodations.from(r)); });
  fu.forEach(r => { const s = byId[r.student_id]; if(s) s.followups.push(MAP.followups.from(r)); });
  wo.forEach(r => { const s = byId[r.student_id]; if(s) s.works.push(MAP.works.from(r)); });
  be.forEach(r => { const s = byId[r.student_id]; if(s) s.behavior.push(MAP.behavior.from(r)); });
  co.forEach(r => { const s = byId[r.student_id]; if(s) s.comms.push(MAP.comms.from(r)); });
  return {students};
}
function applyState(st){ state = st; takeSnap(); store.loadedAt = Date.now(); store.error = ""; store.pending = false; setMode("online"); }

function maybeRefresh(force){
  if(!sb || !(me.staff && me.staff.approved) || store.pending || store.refreshing || isPortalRoute(ui.route)) return;
  if(!force && Date.now() - store.loadedAt < 30000) return;
  const seq = store.seq;
  store.refreshing = true;
  fetchState().then(st => {
    store.refreshing = false;
    if(store.seq !== seq || store.pending) return;
    applyState(st);
    if(!$("#modalRoot").innerHTML && ui.route !== "exam" && !isPortalRoute(ui.route)) render();
  }).catch(() => { store.refreshing = false; });
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") maybeRefresh(); });
function dbError(err){
  const m = (err && (err.message || err.details)) || "";
  if(err && err.code === "23505") return "الرقم المدرسي مستخدم لطالب آخر.";
  if(/JWT|jwt|session/i.test(m)) return "انتهت جلسة الدخول. سجّل الدخول من جديد.";
  if(/Failed to fetch|NetworkError|network/i.test(m)) return "لا يوجد اتصال بالإنترنت.";
  if(/row-level security/i.test(m)) return "هذا الصف أو الشعبة ليس من صفوفك. اطلب من مسؤول النظام إضافته لك.";
  if(err && err.code === "42501") return "ليست لديك صلاحية لهذا الإجراء.";
  return "تعذّر الحفظ" + (m ? ": " + m : ".");
}
async function syncNow(){
  const cur = rowsOf(state), ups = {}, dels = {};
  cur.forEach((v, k) => { const j = JSON.stringify(v.row); if(snap.get(k) !== j) (ups[v.t] = ups[v.t] || []).push([k, v.row, j]); });
  snap.forEach((j, k) => { if(!cur.has(k)){ const [t, id] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)]; (dels[t] = dels[t] || []).push([k, id]); } });
  const upOrder = ["students","goals","accommodations","followups","works","behavior","comms"];
  for(const t of upOrder){
    const list = ups[t]; if(!list || !list.length) continue;
    const {error} = await sb.from(t).upsert(list.map(x => x[1]));
    if(error) throw error;
    list.forEach(([k, , j]) => snap.set(k, j));
  }
  for(const t of upOrder.slice().reverse()){
    const list = dels[t]; if(!list || !list.length) continue;
    const {error} = await sb.from(t).delete().in("id", list.map(x => x[1]));
    if(error) throw error;
    list.forEach(([k]) => snap.delete(k));
  }
}
function save(){
  store.seq++; store.pending = true; renderStoreChip();
  clearTimeout(store.timer);
  store.timer = setTimeout(() => {
    store.syncing = store.syncing.then(async () => {
      try { await syncNow(); store.pending = false; store.error = ""; setMode("online"); }
      catch(err){ console.warn("sync failed", err); store.error = dbError(err); setMode("error"); toast(store.error, {label:"إعادة المحاولة", fn:() => save()}); }
    });
  }, 400);
}

const stu = id => state.students.find(s => s.id === id);
const goalOf = (s, gid) => s.iep.goals.find(g => g.id === gid);
const sortDesc = (a, b) => (b.date||"").localeCompare(a.date||"") || 0;
const sortAsc = (a, b) => (a.date||"").localeCompare(b.date||"");

function compare(goal, f){
  if(!goal) return {ok:false, text:"غير مرتبط بهدف"};
  const b = goal.baseline;
  if(!b || !(b.total > 0)) return {ok:false, text:"لا يوجد قياس بداية للهدف"};
  if(!(f.total > 0)) return {ok:false, text:"لا توجد محاولات"};
  if(b.support !== f.support) return {ok:false, text:"غير قابل للمقارنة: مستوى الدعم مختلف (البداية: " + b.support + ")"};
  const diff = pct(f.correct, f.total) - pct(b.correct, b.total);
  return {ok:true, diff, text: diff > 0 ? "+" + diff + " نقطة عن البداية" : diff < 0 ? diff + " نقطة عن البداية" : "مساوٍ لمستوى البداية"};
}
function cmpHTML(c){
  if(!c.ok) return '<span class="cmp na">'+esc(c.text)+'</span>';
  const cls = c.diff > 0 ? "up" : c.diff < 0 ? "down" : "";
  return '<span class="cmp '+cls+'">'+esc(c.text)+'</span>';
}
function goalMeasures(s, gid){ return s.followups.filter(f => f.goalId === gid).sort(sortAsc); }
function goalDue(s, g){
  const ms = goalMeasures(s, g.id); const last = ms[ms.length-1];
  const age = last ? daysBetween(last.date, today()) : Infinity;
  return {due: age >= (g.freq||7), age, last};
}
function dueGoals(){
  const out = [];
  state.students.forEach(s => s.iep.goals.forEach(g => { const d = goalDue(s, g); if(d.due) out.push({s, g, ...d}); }));
  return out.sort((a,b) => b.age - a.age);
}
function openActions(){
  const out = [];
  state.students.forEach(s => {
    s.behavior.forEach(b => { if(b.status === "open") out.push({kind:"behavior", s, r:b}); });
    s.comms.forEach(c => { if(c.status === "open") out.push({kind:"comm", s, r:c}); });
  });
  return out.sort((a,b) => (a.r.followDate||"9999").localeCompare(b.r.followDate||"9999"));
}
function dueTag(iso){
  if(!iso) return '<span class="tag">بلا موعد</span>';
  const n = daysBetween(today(), iso);
  if(n < 0) return '<span class="tag late">متأخر '+daysAr(-n)+'</span>';
  if(n === 0) return '<span class="tag due">اليوم</span>';
  return '<span class="tag">'+(n===1?'غدًا':'بعد '+daysAr(n))+' · '+esc(fmt(iso))+'</span>';
}
function studentFlags(s){
  const due = s.iep.goals.filter(g => goalDue(s,g).due).length;
  const open = s.behavior.filter(b => b.status==="open").length + s.comms.filter(c => c.status==="open").length;
  return {due, open};
}

/* ---------- Student file ---------- */
function trailSVG(s, g, w=320, h=64){
  const ms = goalMeasures(s, g.id);
  const pad = 8, n = ms.length + 1;
  const x = i => n === 1 ? w/2 : w - pad - i * (w - 2*pad) / (n-1);
  const y = p => h - pad - (p/100) * (h - 2*pad);
  const b = g.baseline && g.baseline.total ? pct(g.baseline.correct, g.baseline.total) : null;
  let out = `<svg class="trail" viewBox="0 0 ${w} ${h}" role="img" aria-label="أثر التقدم: ${ms.length} قياسات">`;
  out += `<line x1="${pad}" x2="${w-pad}" y1="${y(g.target)}" y2="${y(g.target)}" stroke="var(--pos)" stroke-width="1" stroke-dasharray="2 4"/>`;
  if(b !== null) out += `<line x1="${pad}" x2="${w-pad}" y1="${y(b)}" y2="${y(b)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4" opacity=".7"/>`;
  const pts = [b !== null ? {p:b, base:true, cmp:true} : null].concat(ms.map(f => ({p:pct(f.correct,f.total), cmp: compare(g,f).ok}))).filter(Boolean);
  if(pts.length > 1) out += `<polyline fill="none" stroke="var(--primary)" stroke-width="2" opacity=".35" points="${pts.map((pt,i)=>x(i)+","+y(pt.p)).join(" ")}"/>`;
  pts.forEach((pt,i) => {
    const r = 3 + Math.min(i, 6) * 0.45;
    if(pt.base) out += `<rect x="${x(i)-4}" y="${y(pt.p)-4}" width="8" height="8" fill="var(--muted)"/>`;

  });
  return out + "</svg>";
}

function reportHTML(s, from, to){

    .sort((a,b) => (a.r.followDate||"9").localeCompare(b.r.followDate||"9"));
  const bc = {positive:0,note:0,violation:0}; beh.forEach(b => bc[b.type]++);

      <div><dt>الاحتياج</dt><dd>${esc(s.category)}</dd></div>
      <div><dt>منسق الحالة</dt><dd>${esc(s.coordinator)}</dd></div>

/* ---------- WhatsApp to guardian ---------- */
function waNumber(phone){
  let d = String(phone||"").replace(/\D/g,"");
  if(d.startsWith("00")) d = d.slice(2);
  if(d.length === 10 && d.startsWith("05")) d = "971" + d.slice(1);
  else if(d.length === 9 && d.startsWith("5")) d = "971" + d;
  return d.length >= 11 ? d : null;
}
function waMessage(s, from, to){
  const inP = d => d >= from && d <= to;
  const fus = s.followups.filter(f => inP(f.date)).sort(sortAsc);
  const bc = {positive:0,note:0,violation:0}; s.behavior.filter(b => inP(b.date)).forEach(b => bc[b.type]++);
  const openN = s.behavior.filter(b => b.status==="open").length + s.comms.filter(c => c.status==="open").length;
  const lines = s.iep.goals.map((goal,i) => {
    const ms = fus.filter(f => f.goalId === goal.id); const last = ms[ms.length-1];
    if(!last) return `${i+1}. ${goal.area}: لا يوجد قياس في هذه الفترة`;
    const p = pct(last.correct,last.total);
    return `${i+1}. ${goal.area}: آخر نتيجة ${last.correct}/${last.total} (${p}%)، والمعيار ${goal.target}% ${p >= goal.target ? "✅ بلغ المعيار" : "⏳ دون المعيار"}`;
  });
  return [
    `السلام عليكم ولي أمر الطالب الكريم،`,
    ``,
    `ملخص تقرير متابعة الطالب *${s.name}*`,
    `${s.grade} / شعبة ${s.section}`,
    `الفترة: من ${fmt(from)} إلى ${fmt(to)}`,
    ``,
    `*نتائج أهداف الخطة الفردية:*`,
    ...lines,
    ``,
    `*السلوك:* إيجابي ${bc.positive} · ملاحظات ${bc.note} · مخالفات ${bc.violation}`,
    `*إجراءات مفتوحة:* ${openN}`,
    ``,
    `التقرير الكامل متاح لدى المدرسة، ويسعدنا تواصلكم مع منسق الحالة ${s.coordinator || ""}.`.replace(" .","."),
    `مدرسة رأس الخيمة الثانوية للبنين · برنامج أصحاب الهمم`
  ].join("\n");
}
/* parents' numbers: father (phone) and mother (phone2) */
function parentNums(s){
  return [{who:"f", label:"الوالد", raw:s.phone, num:waNumber(s.phone)}, {who:"m", label:"الوالدة", raw:s.phone2, num:waNumber(s.phone2)}].filter(x => x.num);
}
function waLinks(s, text, onClickAct){
  return parentNums(s).map(p => `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${p.num}?text=${encodeURIComponent(text)}" ${onClickAct ? `data-act="${onClickAct}" data-sid="${s.id}" data-who="${p.who}"` : ""}>${ICON.wa}واتساب ${p.label}</a>`).join("");
}
function waURL(s, who){ const p = parentNums(s).find(x => x.who === who) || parentNums(s)[0]; return p ? "https://wa.me/" + p.num + "?text=" + encodeURIComponent(waMessage(s, ui.report.from, ui.report.to)) : null; }
function logWa(s, who){
  const p = parentNums(s).find(x => x.who === who) || parentNums(s)[0];
  s.comms.push({id:uid("c"), date:today(), with:p && p.who === "m" ? "الوالدة" : "الوالد", channel:"رسالة واتساب", summary:"فُتح واتساب لإرسال ملخص تقرير الفترة من "+fmt(ui.report.from)+" إلى "+fmt(ui.report.to)+" إلى "+(p ? p.label + " على الرقم " + p.raw : "ولي الأمر")+".", action:"", by:"", status:"closed", followDate:""});
  save();
}
function sendWa(s){
  const ps = parentNums(s);
  if(!ps.length){ toast("لا يوجد رقم صالح لولي الأمر. أضِفه من «تعديل بيانات الطالب»."); return; }

  const w = window.open(waURL(s, ps[0].who), "_blank"); try { if(w) w.opener = null; } catch(e){}
  logWa(s, ps[0].who);
  toast(w === null ? "المتصفح منع فتح واتساب. استخدم زر واتساب في أعلى التقرير." : "فُتح واتساب برسالة جاهزة. اضغط إرسال هناك، وسُجّل التواصل في ملف الطالب.");
}

/* ---------- Modal & forms ---------- */
let lastFocus = null;
function closeModal(){ $("#modalRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function escClose(e){ if(e.key === "Escape") closeModal(); }
function fieldHTML(f, val){
  const id = "f_"+f.name, v = val ?? f.value ?? "";
  const cls = f.full ? "field full" : "field";
  const req = f.required ? ' required aria-required="true"' : "";
  let input;
  if(f.type === "textarea") input = `<textarea id="${id}" name="${f.name}"${req} placeholder="${esc(f.placeholder||"")}">${esc(v)}</textarea>`;
  else if(f.type === "select") input = `<select id="${id}" name="${f.name}"${req}>${(f.options||[]).map(o => { const [ov,ol] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(ov)}" ${String(ov)===String(v)?"selected":""}>${esc(ol)}</option>`; }).join("")}</select>`;
  else if(f.type === "combo") input = `<input type="text" id="${id}" name="${f.name}" list="${id}_l" value="${esc(v)}"${req} autocomplete="off" placeholder="${esc(f.placeholder||"")}"><datalist id="${id}_l">${f.options.map(o => `<option value="${esc(o)}">`).join("")}</datalist>`;
  else input = `<input type="${f.type||"text"}" id="${id}" name="${f.name}" value="${esc(v)}"${req} ${f.type==="number"?'inputmode="numeric" min="0" step="1"':''} placeholder="${esc(f.placeholder||"")}">`;
  return `<div class="${cls}" data-field="${f.name}"><label for="${id}">${esc(f.label)}${f.required?' <span aria-hidden="true" style="color:var(--bad)">*</span>':''}</label>${input}${f.hint?'<span class="hint">'+esc(f.hint)+'</span>':''}<span class="err" role="alert"></span></div>`;
}
function openForm({title, fields, values={}, submitLabel="حفظ", onSave, onDelete, extraHTML="", onInput, validate}){
  lastFocus = document.activeElement;
  $("#modalRoot").innerHTML = `<div class="scrim" data-act="scrim"><form class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate>
    <div class="modal-h"><h2 id="mTitle">${esc(title)}</h2><button type="button" class="x" data-act="close-modal" aria-label="إغلاق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-b">${fields.map(f => f.html ? f.html(values) : fieldHTML(f, values[f.name])).join("")}${extraHTML}</div>
    <div class="modal-f"><button type="submit" class="btn primary">${esc(submitLabel)}</button><button type="button" class="btn" data-act="close-modal">إلغاء</button><span class="sp"></span>${onDelete?'<button type="button" class="btn danger" data-act="delete-rec">حذف</button>':''}</div>
  </form></div>`;
  const form = $("#modalRoot form");
  document.addEventListener("keydown", escClose);
  const first = form.querySelector("input,select,textarea"); if(first) first.focus();
  const collect = () => { const o = {}; new FormData(form).forEach((v,k) => o[k] = typeof v === "string" ? v.trim() : v); return o; };
  if(onInput){ form.addEventListener("input", e => onInput(collect(), form, e)); form.addEventListener("change", e => onInput(collect(), form, e)); onInput(collect(), form, {}); }
  form.addEventListener("submit", e => {
    e.preventDefault();
    const vals = collect(); const errs = {};
    fields.forEach(f => { if(f.required && !vals[f.name]) errs[f.name] = "هذا الحقل مطلوب."; });
    if(validate) Object.assign(errs, validate(vals) || {});
    $$(".field", form).forEach(el => { const n = el.dataset.field; const er = el.querySelector(".err"); const inp = el.querySelector("input,select,textarea");
      if(er) er.textContent = errs[n] || ""; if(inp) inp.classList.toggle("invalid", !!errs[n]); if(inp) inp.setAttribute("aria-invalid", errs[n] ? "true" : "false"); });
    const firstBad = Object.keys(errs)[0];
    if(firstBad){ const el = form.querySelector('[name="'+firstBad+'"]'); if(el) el.focus(); return; }
    onSave(vals);
  });
  if(onDelete){
    const del = form.querySelector('[data-act="delete-rec"]');
    del.addEventListener("click", () => { if(del.dataset.armed){ onDelete(); closeModal(); } else { del.dataset.armed = "1"; del.textContent = "اضغط مرة أخرى لتأكيد الحذف"; } });
  }
}

function openFollowupForm({sid, gid, fu}){
  const locked = !!sid;

  const v = fu ? {...fu} : {date: today(), goalId: gid || "", support: s0 && gid && goalOf(s0,gid) && goalOf(s0,gid).baseline ? goalOf(s0,gid).baseline.support : "مستقل", correct:"", total:"", by:""};
  const goalOpts = s => [["","— اختر هدفًا من الخطة —"]].concat((s ? s.iep.goals : []).map(g => [g.id, g.area])).concat([["none","غير مرتبط بهدف"]]);
  const fields = [];
  if(!locked) fields.push({name:"sid", label:"الطالب", type:"select", required:true, full:true, options:[["","— اختر الطالب —"]].concat(state.students.map(x => [x.id, x.name+" ("+x.schoolNo+")"]))});
  fields.push(
    {name:"date", label:"التاريخ", type:"date", required:true},
    {name:"subject", label:"المادة", type:"combo", options:SUBJECTS, required:true, placeholder:"اختر أو اكتب"},
    {name:"task", label:"المهمة", type:"text", required:true, full:true, placeholder:"ماذا طُلب من الطالب؟"},
    {name:"goalId", label:"هدف الخطة المرتبط", type:"select", required:true, full:true, options:goalOpts(s0)},
    {name:"outcome", label:"ناتج التعلم", type:"text", required:true, full:true},
    {name:"strategy", label:"الاستراتيجية", type:"combo", options:STRATEGIES, required:true},
    {name:"support", label:"مستوى الدعم", type:"select", options:SUPPORT, required:true},
    {name:"score", label:"نتيجة الطالب", html: vals => `<div class="field full" data-field="score"><label for="f_correct">نتيجة الطالب <span aria-hidden="true" style="color:var(--bad)">*</span></label>
      <div class="score"><input type="number" id="f_correct" name="correct" value="${esc(vals.correct)}" inputmode="numeric" min="0" step="1" aria-label="عدد المحاولات الصحيحة" placeholder="صحيحة"><span>من</span><input type="number" id="f_total" name="total" value="${esc(vals.total)}" inputmode="numeric" min="1" step="1" aria-label="إجمالي المحاولات" placeholder="المحاولات"><span class="muted">محاولة</span></div>
      <span class="err" role="alert"></span></div>`},
    {name:"by", label:"المسؤول عن المتابعة", type:"text", placeholder:"اسم المعلم"},
    {name:"notes", label:"ملاحظات", type:"text"}
  );
  if(fu && fu.goalId === "") v.goalId = "none";
  openForm({
    title: fu ? "تعديل متابعة يومية" : "إضافة متابعة يومية" + (s0 ? " · " + s0.name : ""),
    fields, values:v, submitLabel: fu ? "حفظ التعديل" : "حفظ المتابعة",
    extraHTML:'<div class="preview" id="fuPreview" aria-live="polite"></div>',
    onInput:(vals, form, e) => {
      if(!locked && e && e.target && e.target.name === "sid"){
        curSid = vals.sid; const sel = form.querySelector('[name="goalId"]');
        sel.innerHTML = goalOpts(stu(curSid)).map(([a,b]) => `<option value="${esc(a)}">${esc(b)}</option>`).join("");
      }
      if(e && e.target && e.target.name === "goalId"){
        const s = stu(curSid), g = s && goalOf(s, vals.goalId);
        if(g && g.baseline && g.baseline.support){ form.querySelector('[name="support"]').value = g.baseline.support; vals.support = g.baseline.support; }
        const oc = form.querySelector('[name="outcome"]'); if(g && !oc.value) oc.placeholder = "مثال: مهارة مرتبطة بـ " + g.area;
      }
      const s = stu(curSid), g = s && goalOf(s, vals.goalId);
      const c = parseInt(vals.correct,10), t = parseInt(vals.total,10);
      const p = $("#fuPreview");
      if(!s){ p.innerHTML = '<span class="muted">اختر الطالب لعرض مستوى البداية.</span>'; return; }
      if(!g){ p.innerHTML = vals.goalId === "none" ? '<span class="muted">المتابعة غير مرتبطة بهدف، فلن تُقارن بمستوى بداية.</span>' : '<span class="muted">اختر هدف الخطة لعرض مستوى البداية.</span>'; return; }
      const b = g.baseline;
      const baseTxt = b && b.total ? `مستوى البداية: <b class="num">${b.correct}/${b.total} (${pct(b.correct,b.total)}%)</b> بدعم «${esc(b.support)}» · المعيار ${g.target}%` : "لا يوجد قياس بداية لهذا الهدف.";
      if(!(t > 0) || isNaN(c)){ p.innerHTML = baseTxt; return; }
      if(c > t || c < 0){ p.innerHTML = baseTxt + '<br><span style="color:var(--bad)">عدد الصحيحة يجب أن يكون بين 0 وإجمالي المحاولات.</span>'; return; }
      p.innerHTML = baseTxt + `<br>النتيجة الحالية: <b class="num">${c}/${t} (${pct(c,t)}%)</b> · ` + cmpHTML(compare(g, {correct:c, total:t, support:vals.support}));

      else if(!Number.isInteger(t) || t < 1) e.score = "إجمالي المحاولات يجب أن يكون 1 أو أكثر.";

    },

  });
}

const QTYPES = {mcq:"اختيار من متعدد", tf:"صح أو خطأ", short:"إجابة قصيرة", num:"إجابة رقمية"};
const AR_L = ["أ","ب","ج","د","هـ","و"];
const SHOW = {answers:"الدرجة والإجابات الصحيحة", score:"الدرجة فقط", none:"لا شيء (يُبلَّغ لاحقًا)"};
const EX_STATUS = {draft:["مسودة",""], open:["مفتوح","ok"], closed:["مغلق","late"]};
let renderTok = 0;
function wsAnswerText(q, k){
  if(k === undefined || k === null) return "—";
  if(q.type === "mcq") return AR_L[k] + ") " + ((q.options || [])[k] || "");
  if(q.type === "tf") return k === "t" ? "صح" : "خطأ";
  if(q.type === "short") return (k && k[0]) || "—";
  if(q.type === "num") return String(k.v);
  return "—";
}
function scoreTag(sc){ if(!sc || !sc.total) return ""; const p = pct(sc.correct, sc.total); return `<span class="tag ${p >= 80 ? 'ok' : p >= 50 ? 'due' : 'late'} num">${sc.correct}/${sc.total} · ${p}%</span>`; }
const toLocalInput = iso => { if(!iso) return ""; const d = new Date(iso); return isoOf(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
const fmtDT = iso => { if(!iso) return "—"; try { return new Date(iso).toLocaleString("ar-AE-u-nu-latn", {day:"numeric", month:"short", hour:"numeric", minute:"2-digit"}); } catch(e){ return iso; } };
function compressImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error("read"));
    fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error("decode"));
      im.onload = () => { let dim = 1400, q = 0.72, out = "";
        for(let i = 0; i < 10; i++){ const sc = Math.min(1, dim / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
          const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); out = c.toDataURL("image/jpeg", q);
          if(out.length <= 170000) break; if(q > 0.5) q -= 0.1; else dim = Math.round(dim * 0.8); }
        res(out); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

function exInput(t){
  const d = ui.exDraft; if(!d) return;
  const k = t.dataset.k, i = Number(t.dataset.q), q = d.questions[i];
  if(["title","subject","outcome","instructions","show_results"].includes(k)){ d[k] = t.value; return; }
  if(k === "opens_at" || k === "closes_at"){ d[k] = fromLocalInput(t.value); return; }
  if(k === "duration_min"){ d.duration_min = t.value ? Math.max(1, parseInt(t.value, 10) || 0) || null : null; return; }
  if(k === "max_attempts"){ d.max_attempts = Math.min(10, Math.max(1, parseInt(t.value, 10) || 1)); return; }
  if(k === "shuffle"){ d.shuffle = t.checked; return; }
  if(k === "support"){ d.support = t.value; return; }
  if(k === "addFu"){ d.addFu = t.value === "1"; return; }
  if(k === "asg"){ if(t.checked) d.assign[t.dataset.sid] = {goal:""}; else delete d.assign[t.dataset.sid]; render(); return; }
  if(k === "asg-goal"){ if(d.assign[t.dataset.sid]) d.assign[t.dataset.sid].goal = t.value; return; }
  if(!q) return;
  if(k === "text") q.text = t.value;
  else if(k === "points") q.points = Number(t.value) > 0 ? Number(t.value) : 1;
  else if(k === "opt") q.options[Number(t.dataset.o)] = t.value;
  else if(k === "ans") d.key[q.id] = q.type === "mcq" ? Number(t.value) : t.value;
  else if(k === "short") d.key[q.id] = t.value.split(/[،,\n]/).map(x => x.trim()).filter(Boolean);
  else if(k === "num") d.key[q.id] = Object.assign({tol:0}, typeof d.key[q.id] === "object" ? d.key[q.id] : {}, {v:t.value.trim()});
  else if(k === "tol") d.key[q.id] = Object.assign({v:""}, typeof d.key[q.id] === "object" ? d.key[q.id] : {}, {tol:t.value.trim()});
  else if(k === "type"){ q.type = t.value; if(q.type === "mcq" && (!q.options || q.options.length < 2)) q.options = ["", "", "", ""]; delete d.key[q.id]; render(); }
}
function blankQ(type){ return {id:uid("q"), type, text:"", points:1, options: type === "mcq" ? ["", "", "", ""] : []}; }
function numOf(v){ const x = parseFloat(String(v ?? "").replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[٫,]/g, ".")); return isFinite(x) ? x : null; }
function validateExam(d, publish){
  const e = {_list:[]};
  if(!d.title.trim()){ e.title = 1; e._list.push("اكتب عنوان الامتحان."); }
  if(!d.questions.length) e._list.push("أضف سؤالًا واحدًا على الأقل.");
  if(d.opens_at && d.closes_at && d.closes_at <= d.opens_at) e._list.push("موعد الإغلاق يجب أن يكون بعد موعد الفتح.");
  if(publish && !Object.keys(d.assign).length) e._list.push("اختر طالبًا واحدًا على الأقل قبل النشر.");
  d.questions.forEach((q, i) => {
    const k = d.key[q.id]; let m = "";
    if(!q.text.trim()) m = "اكتب نص السؤال.";
    else if(q.type === "mcq"){ if(q.options.length < 2 || q.options.some(o => !o.trim())) m = "أكمل نصوص الخيارات."; else if(k === undefined || k === "" || !q.options[k]) m = "اختر الإجابة الصحيحة."; }
    else if(q.type === "tf"){ if(k !== "t" && k !== "f") m = "اختر صح أو خطأ."; }
    else if(q.type === "short"){ if(!k || !k.length) m = "اكتب إجابة مقبولة واحدة على الأقل."; }
    else if(q.type === "num"){ if(!k || numOf(k.v) === null) m = "اكتب الإجابة الرقمية الصحيحة."; else if(String(k.tol ?? "").trim() !== "" && numOf(k.tol) === null) m = "الهامش يجب أن يكون رقمًا."; }
    if(m){ e["q" + i] = m; e._list.push("السؤال " + (i+1) + ": " + m); }
  });
  return e;
}
async function saveExam(st, btn){
  const d = ui.exDraft; const e = validateExam(d, st === "open");
  if(e._list.length){ ui.exErrs = e; render(); window.scrollTo(0, 0); return; }
  ui.exErrs = null;
  const key = {};

  const id = d.id || (crypto.randomUUID ? crypto.randomUUID() : uid("ex"));
  const row = {id, title:d.title.trim(), subject:(d.subject || "").trim(), outcome:(d.outcome || "").trim(), instructions:(d.instructions || "").trim(), images:d.images, questions:d.questions.map(q => ({id:q.id, type:q.type, text:q.text.trim(), points:Number(q.points) || 1, options:q.options.map(o => o.trim())})),
    key, kind:d.kind, status:st, opens_at:d.opens_at, closes_at:d.closes_at, duration_min:d.duration_min, shuffle:!!d.shuffle, show_results:d.show_results, max_attempts:d.max_attempts || 1, updated_at:new Date().toISOString()};

    if(rows.length){ r = await sb.from("exam_assignments").insert(rows); if(r.error) throw r.error; }

    ui.exDraft = null; toast(st === "open" ? "حُفظ ونُشر للطلاب المحددين." : "حُفظ."); go("results-" + id);
    if(d.attempts) loadAll().catch(() => {});
  } catch(err){ btn.disabled = false; toast(dbError(err)); }
}
async function addExamImages(files){

}

function authErr(err){
  const m = (err && err.message) || "";
  if(/email_domain_not_allowed|Database error saving new user/i.test(m)) return DOMAIN_MSG;
  if(/Invalid login credentials/i.test(m)) return "البريد أو كلمة المرور غير صحيحة.";
  if(/Email not confirmed/i.test(m)) return "فعّل حسابك من الرسالة التي وصلت إلى بريدك أولًا.";
  if(/expired|invalid.*(otp|token)|otp.*(expired|invalid)|Token has expired/i.test(m)) return "الرمز غير صحيح أو انتهت صلاحيته. اطلب رمزًا جديدًا.";
  if(/already registered/i.test(m)) return "هذا البريد مسجّل بالفعل. سجّل الدخول.";
  if(/Password should be/i.test(m)) return "كلمة المرور قصيرة؛ استخدم 8 أحرف على الأقل.";
  if(/rate limit/i.test(m)) return "محاولات كثيرة. انتظر قليلًا ثم حاول.";
  if(/Failed to fetch/i.test(m)) return "لا يوجد اتصال بالإنترنت أو إعداد الرابط غير صحيح.";
  return m || "حدث خطأ غير متوقع.";
}

    } else if(id === "fRecover"){

function pExamState(x){

  if(x.used >= x.max_attempts) return {k:"done", label:"سُلّم", cls:"ok"};
  if(x.status !== "open" || (x.closes_at && now > Date.parse(x.closes_at))) return {k:"closed", label:x.used ? "سُلّم" : "مغلق", cls:x.used ? "ok" : "late"};

}

async function pRunExam(id){
  const v = $("#view");
  if(P.run && P.run.exam_id === id && $("#pRun")) return;
  v.innerHTML = '<div class="panel empty">جارٍ فتح الامتحان…</div>';
  let d;
  try { d = await pRpc("portal_start", {p_exam_id:id}); } catch(err){ if(!err.handled) v.innerHTML = `<div class="panel empty"><p>${esc(err.message)}</p><a class="btn" href="#portal">العودة</a></div>`; return; }
  if(!d.ok){ v.innerHTML = `<div class="panel empty"><p>${esc(pErr(d.error))}</p><a class="btn" href="#portal">العودة</a></div>`; P.data = null; return; }
  const R = P.run = Object.assign(d, {ans:Object.assign({}, d.answers), checks:d.checks || {}, big:false, dirty:false, done:false, result:null,
    offset:Date.parse(d.server_now) - Date.now(), saveTimer:null, tick:null});
  v.innerHTML = '<div id="pRun"></div>';
  pPaint();

function pLeft(){ const R = P.run; return R && R.deadline ? Date.parse(R.deadline) - (Date.now() + R.offset) : null; }
function pTick(){
  const R = P.run; if(!R || R.done){ return; }

  if(ms === null) return;
  if(ms <= 0){ clearInterval(R.tick); pSubmit(true); return; }
  const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
  if(el){ el.textContent = m + ":" + pad(s); el.parentElement.classList.toggle("warn", ms < 120000); }
}

function pResultHTML(){

async function pSaveNow(){

async function pCheck(qid){

async function pSubmit(auto, btn){

    const empty = R.questions.filter(q => R.ans[q.id] == null || String(R.ans[q.id]).trim() === "").length;
    if(btn && !btn.dataset.armed){ btn.dataset.armed = "1"; btn.textContent = empty ? `بقي ${empty} بلا إجابة. اضغط مرة أخرى للتسليم` : "اضغط مرة أخرى لتأكيد التسليم"; return; }
  }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, action){
  clearTimeout(toastTimer);
  const r = $("#toastRoot");
  r.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${action?'<button type="button" id="toastAct">'+esc(action.label)+'</button>':''}</div>`;
  if(action) $("#toastAct").addEventListener("click", () => { r.innerHTML = ""; action.fn(); });
  toastTimer = setTimeout(() => { r.innerHTML = ""; }, action ? 9000 : 3500);
}

/* report download via the downloads capability */
let downloadsApi = null;
const downloadsReady = (async () => {
  try { if(window.claude && window.claude.use){ downloadsApi = await window.claude.use("downloads"); } } catch(e){ downloadsApi = null; }
})();
async function initDownloads(){ await downloadsReady; }
function reportFileHTML(s){
  const css = Array.from(document.querySelectorAll("style")).map(x => x.textContent).join("\n");
  return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تقرير '+esc(s.name)+'</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">'
    + '<style>'+css+'\nbody{background:#fff;padding:16px;padding-bottom:16px} body::before{display:none} .paper{margin:0 auto}</style></head><body>'
    + reportHTML(s, ui.report.from, ui.report.to) + '</body></html>';
}
async function downloadReport(btn){
  const s = stu(ui.report.sid); if(!s) return;
  if(btn){ btn.disabled = true; }
  try {
    if(!(window.claude && window.claude.use)){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([reportFileHTML(s)], {type:"text/html"}));
      a.download = "تقرير-" + s.schoolNo + "-" + ui.report.from + "-إلى-" + ui.report.to + ".html";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast("نُزّل التقرير بصيغة HTML."); return;
    }
    if(!downloadsApi){ toast("جارٍ تجهيز التنزيل…"); await Promise.race([downloadsReady, new Promise(r => setTimeout(r, 10000))]); }
    if(!downloadsApi){ toast("التنزيل غير متاح في هذا العرض. افتح الأداة من رابطها على claude.ai، أو اطبع واختر «حفظ بتنسيق PDF»."); return; }
    const name = "تقرير-" + s.schoolNo + "-" + ui.report.from + "-إلى-" + ui.report.to + ".html";
    await downloadsApi.save({filename:name, data:new Blob([reportFileHTML(s)])});
    toast("نُزّل التقرير بصيغة HTML.");
  } catch(err){
    const c = err && err.code;
    if(c === "declined") toast("أُلغي التنزيل.");
    else if(c === "rate_limited") toast("فيه نافذة تنزيل مفتوحة بالفعل. أكملها أو انتظر قليلًا ثم حاول.");
    else toast("تعذّر التنزيل في هذا العرض" + (c ? " (" + c + ")" : "") + ". اطبع واختر «حفظ بتنسيق PDF».");
  } finally { if(btn && document.contains(btn)) btn.disabled = false; }
}

/* ---------- boot ---------- */
const CONFIG = window.ATHAR_CONFIG || {};
Object.assign(ui, parseHash());
(async function boot(){
  const v = $("#view");
  if(!CONFIG.url || !CONFIG.anonKey || /YOUR-/.test(CONFIG.url + CONFIG.anonKey)){ shellMode("auth"); v.innerHTML = '<div class="auth"><div class="auth-card panel"><h1>النظام غير مُعَدّ بعد</h1><p>افتح ملف index.html، وضع رابط مشروع Supabase والمفتاح العام في قسم <b dir="ltr">ATHAR_CONFIG</b> أعلى الملف، ثم ارفعه من جديد.</p></div></div>'; return; }
  if(!window.supabase || !window.supabase.createClient){ shellMode("auth"); v.innerHTML = '<div class="auth"><div class="auth-card panel"><h1>تعذّر التحميل</h1><p>لم تُحمَّل مكتبة الاتصال. تحقّق من الإنترنت ثم أعد تحميل الصفحة.</p><button class="btn" onclick="location.reload()">إعادة التحميل</button></div></div>'; return; }
  sb = window.supabase.createClient(CONFIG.url, CONFIG.anonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(ev => { if(ev === "PASSWORD_RECOVERY" && !AUTH.otpReset){ AUTH.view = "recover"; if(!isPortalRoute(ui.route)) showAuth("recover"); } });
  if(isPortalRoute(ui.route)){ render(); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(AUTH.view === "recover") return;
  if(session) await afterSignIn(); else showAuth("login");
})();
window.__athar = { get state(){ return state; }, store, ui, me, P };
})();
</script>
